[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otoclean"
version = "0.1.0"
description = "Akıllı disk temizleme: güvenli / incele / silme sınıflandırması"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "send2trash>=1.8", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "pytest-cov>=5", "pyinstaller>=6"]

[project.scripts]
otoclean = "otoclean.__main__:main"

[tool.setuptools.packages.find]
include = ["otoclean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
